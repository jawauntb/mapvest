paths:
  /v1/health:
    get:
      summary: Health check
      description: Liveness probe. Returns 200 while the API is accepting traffic.
      tags:
        - system
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  uptime:
                    type: number
                    description: Seconds since process start
                required:
                  - status
                  - uptime
  /v1/identify:
    post:
      summary: Identify investable brands from a photo
      description: Accepts a multipart image plus optional location. Runs the vision pipeline and returns detected brands with ticker / comparable / ETF annotations. See `packages/vision`.
      tags:
        - identify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: Photo bytes (JPEG or PNG).
                  format: binary
                location:
                  allOf:
                    - $ref: "#/components/schemas/LatLng"
                    - description: Optional device location to bias identification.
              required:
                - image
      responses:
        "200":
          description: Identification succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/finds:
    get:
      summary: Finds journal for the signed-in user
      description: Every successful `/v1/identify` by a signed-in user records the top investable as a find. Returns finds newest-first.
      tags:
        - identify
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type:
              - number
              - "null"
            description: Max finds to return. Default 100, capped at 200.
            example: 100
          required: false
          description: Max finds to return. Default 100, capped at 200.
          name: limit
          in: query
      responses:
        "200":
          description: Finds returned newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindsResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/nearby:
    get:
      summary: Nearby investable places
      description: "Google Places lookup around a lat/lng, filtered and annotated with tickers/ETFs. Every finance answer includes a `sources: Source[]` array (see AGENTS.md §6)."
      tags:
        - nearby
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: number
          required: true
          name: lat
          in: query
        - schema:
            type: number
          required: true
          name: lng
          in: query
        - schema:
            type: number
            default: 500
          required: false
          name: radius
          in: query
        - schema:
            type: number
            default: 25
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Nearby items resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/widget/nearby:
    get:
      summary: Trimmed nearby payload for home-screen widgets
      description: Same places cascade + brand join as `/v1/nearby`, capped small (max 12) with quotes attached for up to 6 tickers. Built for the iOS WidgetKit and Android home-screen widgets, which refresh on a timeline rather than on demand. No auth required.
      tags:
        - widget
      parameters:
        - schema:
            type: number
          required: true
          name: lat
          in: query
        - schema:
            type: number
          required: true
          name: lng
          in: query
        - schema:
            type: number
            default: 500
          required: false
          name: radius
          in: query
        - schema:
            type: number
            default: 25
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Widget-sized nearby items resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetNearbyResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/widget/map-snapshot:
    get:
      summary: Static map PNG for home-screen widgets
      description: Server-rendered Google Static Maps PNG with a pin for the origin and one per nearby investable, labeled by ticker. Proxies the request so `GOOGLE_MAPS_API_KEY` never reaches a widget extension (see docs/SECRETS.md). Returns 501 when no key is configured.
      tags:
        - widget
      parameters:
        - schema:
            type: number
          required: true
          name: lat
          in: query
        - schema:
            type: number
          required: true
          name: lng
          in: query
        - schema:
            type: number
            default: 500
          required: false
          name: radius
          in: query
        - schema:
            type: number
            default: 25
          required: false
          name: limit
          in: query
        - schema:
            type:
              - number
              - "null"
            description: PNG width in px, capped at 640.
          required: false
          description: PNG width in px, capped at 640.
          name: width
          in: query
        - schema:
            type:
              - number
              - "null"
            description: PNG height in px, capped at 640.
          required: false
          description: PNG height in px, capped at 640.
          name: height
          in: query
      responses:
        "200":
          description: Map snapshot PNG.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Map snapshot not configured (GOOGLE_MAPS_API_KEY unset).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream places lookup or static map request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/resolve-comparable:
    post:
      summary: Resolve a private brand to a public comparable + ETF exposure
      description: Given a brand name, returns the closest public comparable, ETF exposures, and cited sources. Confidence is `low` when the pipeline could not cite a source (do not fabricate).
      tags:
        - finance
      security:
        - bearerAuth: []
      requestBody:
        required: true
