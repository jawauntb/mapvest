  /v1/auth/session:
    post:
      summary: Passwordless email sign-in (magic link)
      description: Starts or completes a magic-link session. On first call with `{email}`, an email is dispatched. On second call with `{email, code}`, a session token is returned.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: Magic-link code from the email. Omit on the first call to trigger send.
              required:
                - email
      responses:
        "200":
          description: Session issued or magic-link dispatched.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      sent:
                        type: boolean
                        enum:
                          - true
                    required:
                      - sent
                  - type: object
                    properties:
                      session:
                        $ref: "#/components/schemas/Session"
                      user:
                        $ref: "#/components/schemas/User"
                    required:
                      - session
                      - user
        "400":
          description: Bad request — validation failed against the zod schema.
