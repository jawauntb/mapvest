paths:
  /v1/health:
    get:
      summary: Health check
      description: Liveness probe. Returns 200 while the API is accepting traffic.
      tags:
        - system
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  uptime:
                    type: number
                    description: Seconds since process start
                required:
                  - status
                  - uptime
  /v1/identify:
    post:
      summary: Identify investable brands from a photo
      description: Accepts a multipart image plus optional location. Runs the vision pipeline and returns detected brands with ticker / comparable / ETF annotations. See `packages/vision`.
      tags:
        - identify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: Photo bytes (JPEG or PNG).
                  format: binary
                location:
                  allOf:
                    - $ref: "#/components/schemas/LatLng"
                    - description: Optional device location to bias identification.
              required:
                - image
      responses:
        "200":
          description: Identification succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/finds:
    get:
      summary: Finds journal for the signed-in user
      description: Every successful `/v1/identify` by a signed-in user records the top investable as a find. Returns finds newest-first.
      tags:
        - identify
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type:
              - number
              - "null"
            description: Max finds to return. Default 100, capped at 200.
            example: 100
          required: false
          description: Max finds to return. Default 100, capped at 200.
          name: limit
          in: query
      responses:
        "200":
          description: Finds returned newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindsResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/progress:
    get:
      summary: Progression (XP, level, streak) for the signed-in user
      description: Server-side truth for XP, level, streak length, and streak-freeze inventory. Written by `recordFind` on every successful `/v1/identify`; the client renders this rather than deriving a streak locally, so the streak survives reinstall. `lastFindDay` is a UTC calendar day (`YYYY-MM-DD`).
      tags:
        - identify
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Progression state returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/universe/summary:
    get:
      summary: Counterfactual universe portfolio
      description: "The `$100 per find at found price` aggregate: what the caller's universe would be worth if $100 had gone into every find at the moment it was found. Computed from each find's `foundPrice` against the current quote. Finds without a `foundPrice` are excluded from the valued totals, never estimated (AGENTS.md §2.4). Hypothetical only — not a holdings statement. `sources` cites each quote provider that actually declared itself, with confidence derived from the quote's own freshness declaration (AGENTS.md §6 — a quote reporting no provider adds no citation rather than a fabricated one)."
      tags:
        - identify
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Universe summary computed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniverseSummary"
        "400":
          description: Bad request — validation failed against the zod schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded (per-user or per-ip).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/dex:
    get:
      summary: Collection progress (sector dexes + regional tiles)
      description: "Derived on read by reconciling the caller's finds against the `brands.json` seed in `packages/finance`: per-sector found/total counts, plus `tilesVisited` (distinct geohash-6 tiles with at least one find). Rarity tiers are enumerated by the `DexRarity` component."
      tags:
        - identify
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dex progress returned.
          content:
