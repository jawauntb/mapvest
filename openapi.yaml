  /v1/graph/{ticker}:
    get:
      summary: Company value-chain graph
      description: "Cache-first: served from the `company_edges` store, extracted on miss with in-flight dedupe per ticker and refreshed when a new 10-K lands rather than on a short TTL. Cache hits are free and identity-less; a cache MISS spends provider money, so generation requires a bearer session or `X-Device-Id` and counts against the free-tier generation quota (402 when spent; concurrent callers sharing one in-flight extraction are charged once). Edges are cited from 10-K items 1/1A evidence (supplier concentration and >10% customers are disclosed there) plus Exa open-web results; every edge carries `sources` (AGENTS.md §6) and an edge that cannot be cited is not emitted. Private counterparties keep `dstName` with no `dstTicker` — never an invented one. Empty and failing extractions are negatively cached for an hour. Returns 502 when extraction fails."
      tags:
        - finance
      parameters:
        - schema:
            type: string
            example: NVDA
          required: true
          name: ticker
          in: path
      responses:
        "200":
          description: Graph edges returned (cache hit or fresh extraction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyGraphResponse"
        "400":
          description: Bad request — malformed ticker, or a cache-miss generation attempted with neither a bearer session nor an `X-Device-Id` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "402":
          description: Free-tier generation quota spent. Clients must present the paywall, not a generic error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceeded"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "502":
          description: Graph extraction failed (filings or Exa evidence unavailable).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
