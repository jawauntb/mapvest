name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: install + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (must pass)
        run: bun test

      - name: Build api (best-effort — api is scaffold-only until Phase 2)
        run: bun run --filter '@mapvest/api' build || true

      - name: Build landing (must succeed)
        run: bun run --filter '@mapvest/landing' build

  push-postgres:
    name: push account isolation (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mapvest
          POSTGRES_PASSWORD: mapvest
          POSTGRES_DB: mapvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapvest -d mapvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run push Postgres integration tests
        env:
          POSTGRES_URL: postgres://mapvest:mapvest@127.0.0.1:5432/mapvest
        run: bun test apps/api/tests/push.postgres.test.ts
