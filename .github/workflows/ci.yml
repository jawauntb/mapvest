name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: install + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (must pass)
        run: bun test

      - name: Build api (best-effort — api is scaffold-only until Phase 2)
        run: bun run --filter api build || true

      - name: Build landing (must succeed)
        run: bun run --filter landing build
