name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: trigger railway
    runs-on: ubuntu-latest
    # Only deploy when CI on main went green.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    timeout-minutes: 5

    steps:
      - name: Trigger Railway deploy webhook
        env:
          RAILWAY_WEBHOOK: ${{ secrets.RAILWAY_WEBHOOK }}
        run: |
          if [ -z "${RAILWAY_WEBHOOK:-}" ]; then
            echo "::warning::RAILWAY_WEBHOOK secret is not set — skipping deploy (no-op)."
            exit 0
          fi
          # Fire-and-verify: Railway responds 2xx immediately, then deploys async.
          http_code="$(curl -sS -o /tmp/railway_response \
            -w '%{http_code}' \
            -X POST "$RAILWAY_WEBHOOK" \
            -H 'content-type: application/json' \
            -d "{\"ref\":\"${GITHUB_SHA}\"}")"
          echo "railway responded: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::railway webhook returned $http_code"
            cat /tmp/railway_response || true
            exit 1
          fi
          echo "deploy triggered for ${GITHUB_SHA}"
