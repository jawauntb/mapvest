# TestFlight: EAS production iOS build + App Store Connect auto-submit.
#
# Triggers
# - Green `ci` on `main` (same gate as Railway `deploy.yml`)
# - Manual: Actions → ios-eas-production → Run workflow
# - Version tags: `v*`
#
# Do not set EAS_NO_VCS=1. The worker git root is /Users/expo/workingdir/build
# and must contain apps/ios/package.json. A VCS-less pack from apps/ios fails
# in PRE_INSTALL_HOOK (builds 96 and 98).
name: ios-eas-production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  # One store submit at a time so Apple/EAS do not overlap.
  group: ios-eas-production-store
  cancel-in-progress: false

jobs:
  eas-ios:
    name: eas build + auto-submit (ios production)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile

      # apps/ios is not a Bun workspace member (Metro vs hoisted .bun/).
      # eas-cli resolves expo-router locally before it uploads the tarball.
      - name: Install iOS dependencies
        working-directory: apps/ios
        run: npm install --no-workspaces

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Wait so a PRE_INSTALL / compile failure turns this check red.
      # --auto-submit uploads to App Store Connect after the IPA is ready.
      - name: EAS build + submit
        working-directory: apps/ios
        run: >
          eas build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
