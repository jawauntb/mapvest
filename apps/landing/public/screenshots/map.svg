<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 506" role="img" aria-label="Mapvest map view with five public brand pins and two private-brand comparable pins">
  <defs>
    <pattern id="mapGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a2a1e" stroke-width="1"/>
    </pattern>
    <linearGradient id="mapVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="320" height="506" fill="#0a0a0a"/>

  <!-- status bar -->
  <g fill="#ffffff">
    <text x="20" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">9:41</text>
    <rect x="270" y="18" width="18" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    <rect x="272" y="20" width="12" height="6" rx="1"/>
  </g>

  <!-- map area -->
  <rect x="0" y="44" width="320" height="380" fill="#0f1a14"/>
  <rect x="0" y="44" width="320" height="380" fill="url(#mapGrid)"/>

  <!-- landmasses -->
  <path d="M 0 140 Q 60 122 120 138 T 240 132 T 320 150 L 320 218 Q 260 232 200 220 T 100 226 T 0 218 Z"
        fill="#1f3a2a" stroke="#2a5540" stroke-width="1"/>
  <path d="M 0 300 Q 80 288 160 306 T 320 302 L 320 380 L 0 380 Z"
        fill="#1f3a2a" stroke="#2a5540" stroke-width="1"/>

  <!-- roads -->
  <path d="M 0 200 Q 100 186 180 214 T 320 224" fill="none" stroke="#3ee68a" stroke-width="1" stroke-opacity="0.42"/>
  <path d="M 90 44 Q 100 158 160 254 T 200 424" fill="none" stroke="#3ee68a" stroke-width="1" stroke-opacity="0.28"/>
  <path d="M 0 340 Q 160 320 320 340" fill="none" stroke="#3ee68a" stroke-width="1" stroke-opacity="0.28"/>

  <!-- Green pin 1 (public) -->
  <g transform="translate(58,152)">
    <path d="M 0 -16 C -8 -16 -13 -10 -13 -3 C -13 5 -4 11 0 21 C 4 11 13 5 13 -3 C 13 -10 8 -16 0 -16 Z" fill="#3ee68a" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="4" fill="#0a0a0a"/>
  </g>

  <!-- Green pin 2 (public) -->
  <g transform="translate(238,124)">
    <path d="M 0 -16 C -8 -16 -13 -10 -13 -3 C -13 5 -4 11 0 21 C 4 11 13 5 13 -3 C 13 -10 8 -16 0 -16 Z" fill="#3ee68a" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="4" fill="#0a0a0a"/>
  </g>

  <!-- Orange pin 1 (private-brand comparable) -->
  <g transform="translate(138,224)">
    <path d="M 0 -16 C -8 -16 -13 -10 -13 -3 C -13 5 -4 11 0 21 C 4 11 13 5 13 -3 C 13 -10 8 -16 0 -16 Z" fill="#ff9f45" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="4" fill="#0a0a0a"/>
  </g>

  <!-- Green pin 3 (public) — SELECTED with pulse -->
  <g transform="translate(180,268)">
    <circle r="24" fill="none" stroke="#3ee68a" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="14" fill="none" stroke="#3ee68a" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M 0 -18 C -9 -18 -15 -12 -15 -4 C -15 5 -5 12 0 24 C 5 12 15 5 15 -4 C 15 -12 9 -18 0 -18 Z" fill="#3ee68a" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="5" fill="#0a0a0a"/>
  </g>

  <!-- Orange pin 2 (private-brand comparable) -->
  <g transform="translate(78,318)">
    <path d="M 0 -16 C -8 -16 -13 -10 -13 -3 C -13 5 -4 11 0 21 C 4 11 13 5 13 -3 C 13 -10 8 -16 0 -16 Z" fill="#ff9f45" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="4" fill="#0a0a0a"/>
  </g>

  <!-- Green pin 4 (public) -->
  <g transform="translate(258,340)">
    <path d="M 0 -16 C -8 -16 -13 -10 -13 -3 C -13 5 -4 11 0 21 C 4 11 13 5 13 -3 C 13 -10 8 -16 0 -16 Z" fill="#3ee68a" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="4" fill="#0a0a0a"/>
  </g>

  <!-- Green pin 5 (public) -->
  <g transform="translate(220,180)">
    <path d="M 0 -16 C -8 -16 -13 -10 -13 -3 C -13 5 -4 11 0 21 C 4 11 13 5 13 -3 C 13 -10 8 -16 0 -16 Z" fill="#3ee68a" stroke="#0a0a0a" stroke-width="1.5"/>
    <circle cx="0" cy="-3" r="4" fill="#0a0a0a"/>
  </g>

  <rect x="0" y="44" width="320" height="380" fill="url(#mapVignette)"/>

  <!-- search bar -->
  <g transform="translate(16,58)">
    <rect x="0" y="0" width="288" height="36" rx="10" fill="#131313" stroke="#1f1f1f" stroke-width="1"/>
    <circle cx="18" cy="18" r="6" fill="none" stroke="#a1a1a1" stroke-width="1.5"/>
    <line x1="22" y1="22" x2="28" y2="28" stroke="#a1a1a1" stroke-width="1.5" stroke-linecap="round"/>
    <text x="40" y="23" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#6b6b6b">Search a place, brand, or ticker</text>
  </g>

  <!-- ticker chip for selected pin -->
  <g transform="translate(200,238)">
    <rect x="0" y="0" width="96" height="26" rx="5" fill="#0a0a0a" stroke="#3ee68a" stroke-width="1"/>
    <text x="10" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#3ee68a">$HSY</text>
    <text x="52" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#a1a1a1">+0.77%</text>
  </g>

  <!-- legend chip -->
  <g transform="translate(16,388)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#0a0a0a" stroke="#1f1f1f" stroke-width="1" fill-opacity="0.8"/>
    <circle cx="12" cy="13" r="4" fill="#3ee68a"/>
    <text x="22" y="17" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" fill="#a1a1a1">Public · 5</text>
    <circle cx="72" cy="13" r="4" fill="#ff9f45"/>
    <text x="82" y="17" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" fill="#a1a1a1">Private · 2</text>
  </g>

  <!-- bottom sheet peek -->
  <g transform="translate(0,424)">
    <rect x="0" y="0" width="320" height="82" rx="16" fill="#131313" stroke="#1f1f1f" stroke-width="1"/>
    <rect x="146" y="8" width="28" height="4" rx="2" fill="#2a2a2a"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#3ee68a" letter-spacing="1.5">SELECTED · PUBLIC</text>
    <text x="20" y="56" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Hershey&#8217;s Chocolate World</text>
    <text x="20" y="72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1a1">$HSY · NYSE · Consumer Staples</text>
  </g>
</svg>
