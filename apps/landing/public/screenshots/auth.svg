<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 506" role="img" aria-label="Mapvest sign-in screen with magic link email input">
  <rect width="320" height="506" fill="#0a0a0a"/>

  <!-- status bar -->
  <g fill="#ffffff">
    <text x="20" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">9:41</text>
    <rect x="270" y="18" width="18" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    <rect x="272" y="20" width="12" height="6" rx="1"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(160,120)">
    <circle r="30" fill="rgba(62,230,138,0.10)" stroke="rgba(62,230,138,0.35)" stroke-width="1"/>
    <text x="0" y="7" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#3ee68a">M</text>
  </g>

  <!-- wordmark -->
  <text x="160" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-1">Mapvest</text>

  <!-- tagline -->
  <text x="160" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#a1a1a1">Point at a place. See what&#8217;s investable.</text>

  <!-- form label -->
  <text x="28" y="278" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#a1a1a1" letter-spacing="1.5">EMAIL</text>

  <!-- email input -->
  <g transform="translate(28,290)">
    <rect x="0" y="0" width="264" height="44" rx="10" fill="#131313" stroke="#1f1f1f" stroke-width="1"/>
    <text x="14" y="27" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6b6b">you@company.com</text>
    <rect x="14" y="14" width="1" height="16" fill="#3ee68a">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CTA: Send magic link -->
  <g transform="translate(28,346)">
    <rect x="0" y="0" width="264" height="46" rx="10" fill="#3ee68a"/>
    <text x="132" y="29" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#04120a">Send magic link</text>
  </g>

  <!-- helper -->
  <text x="160" y="414" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#6b6b6b">No passwords. We&#8217;ll email you a one-tap link.</text>
  <text x="160" y="432" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" fill="#3ee68a" letter-spacing="1.5">ALPHA · TESTFLIGHT</text>

  <!-- home indicator -->
  <rect x="112" y="486" width="96" height="4" rx="2" fill="#2a2a2a"/>
</svg>
