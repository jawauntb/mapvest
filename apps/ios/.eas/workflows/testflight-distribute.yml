name: Distribute inspected manifest-bound production candidate

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Exact inspected EAS build UUID.
      manifest_hash:
        type: string
        required: true
        description: Validated immutable release-manifest hash.
      source_commit_sha:
        type: string
        required: true
        description: Exact merged main SHA carried by the build.
      what_to_test:
        type: string
        required: true
        description: TestFlight copy rendered from that manifest.
      testflight_group:
        type: string
        required: true
        description: Exact external group named by the release manifest.

jobs:
  distribute_to_testflight:
    name: Distribute exact inspected build
    type: testflight
    env:
      MAPVEST_RELEASE_MANIFEST_HASH: ${{ inputs.manifest_hash }}
      MAPVEST_RELEASE_SOURCE_SHA: ${{ inputs.source_commit_sha }}
    params:
      build_id: ${{ inputs.build_id }}
      profile: production
      external_groups:
        - ${{ inputs.testflight_group }}
      changelog: ${{ inputs.what_to_test }}
      submit_beta_review: true
      wait_processing_timeout_seconds: 3600
