name: Recover external TestFlight distribution

on:
  workflow_dispatch:
    inputs:
      asc_build_id:
        type: string
        required: true
        description: Processed App Store Connect build ID to distribute.
      submit_beta_review:
        type: boolean
        default: true
        description: Submit this build for Beta App Review.

jobs:
  distribute_to_testflight:
    name: Distribute to friend-testers
    type: testflight
    params:
      asc_build_id: ${{ inputs.asc_build_id }}
      external_groups:
        - friend-testers
      changelog: |
        Mapvest beta: try Map, Camera, Your Universe, Research, and Mapvest Daily.
      submit_beta_review: ${{ inputs.submit_beta_review }}
