name: Build and distribute production TestFlight

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  distribute_to_testflight:
    name: Distribute to friend-testers
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      external_groups:
        - friend-testers
      changelog: |
        Mapvest beta: try Map, Camera, Your Universe, Research, and Mapvest Daily.
      submit_beta_review: true
      wait_processing_timeout_seconds: 3600
