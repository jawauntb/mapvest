name: Build manifest-bound production candidate

on:
  workflow_dispatch:
    inputs:
      manifest_hash:
        type: string
        required: true
        description: Validated immutable release-manifest hash.
      source_commit_sha:
        type: string
        required: true
        description: Exact merged main SHA uploaded for this build.
jobs:
  build_ios:
    name: Build exact iOS production source
    type: build
    env:
      MAPVEST_RELEASE_MANIFEST_HASH: ${{ inputs.manifest_hash }}
      MAPVEST_RELEASE_SOURCE_SHA: ${{ inputs.source_commit_sha }}
    params:
      platform: ios
      profile: production
